name: learn-watcher-platform

services:
  db:
    image: postgres:16-alpine
    command: ['postgres', '-c', 'shared_buffers=64MB', '-c', 'work_mem=4MB', '-c', 'max_connections=20', '-c', 'jit=off']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-watcher}
    logging:
      driver: json-file
      options:
        max-size: '1m'
        max-file: '5'
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    image: learn-watcher-platform:${IMAGE_TAG:-latest}
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-watcher}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      AUTH_URL: ${APP_ORIGIN:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET}
      REGISTRATION_TICKET_SECRET: ${REGISTRATION_TICKET_SECRET}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN}
      DEMO_LOGIN: ${DEMO_LOGIN:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    logging:
      driver: json-file
      options:
        max-size: '1m'
        max-file: '5'
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  db_data:
