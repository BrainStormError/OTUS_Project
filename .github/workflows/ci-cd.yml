name: CI/CD

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Blocking checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Dependency rules
        run: npm run deps:check
      - name: Verify env schema matches .env.example
        run: npm run verify:env
      - name: Unit tests
        run: npm test
      - name: Integration tests (Testcontainers)
        run: npm run test:integration
      - name: Audit production dependencies
        run: npm run audit
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://build:build@localhost:5432/build
          APP_ORIGIN: http://localhost:3000
          SESSION_SECRET: build-session-secret-000000000000000000
          REGISTRATION_TICKET_SECRET: build-ticket-secret-0000000000000000
          OAUTH_CLIENT_ID: build-client-id
          OAUTH_CLIENT_SECRET: build-client-secret
          TMDB_ACCESS_TOKEN: build-tmdb-token
      - name: Verify CSP hashes in built documents
        run: npm run csp:verify
      - name: Verify CSP hash against the served document
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp .next/csp-hashes.json .next/standalone/.next/csp-hashes.json
          mkdir -p .next/standalone/public
          pushd .next/standalone > /dev/null
          PORT=3100 HOSTNAME=127.0.0.1 NODE_ENV=production node server.js > /tmp/next.log 2>&1 &
          server=$!
          popd > /dev/null
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3100/login > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-csp.cjs http://127.0.0.1:3100/login
          kill "$server"
        env:
          DATABASE_URL: postgres://build:build@localhost:5432/build
          APP_ORIGIN: http://localhost:3000
          SESSION_SECRET: build-session-secret-000000000000000000
          REGISTRATION_TICKET_SECRET: build-ticket-secret-0000000000000000
          OAUTH_CLIENT_ID: build-client-id
          OAUTH_CLIENT_SECRET: build-client-secret
          TMDB_ACCESS_TOKEN: build-tmdb-token

  build:
    name: Build and deliver images
    needs: checks
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          load: true
          push: false
          tags: learn-watcher-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          load: true
          push: false
          tags: learn-watcher-platform-migrate:latest
          cache-from: type=gha
      - name: Show image sizes
        run: docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      - name: Trust deploy host
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "DEPLOY_KNOWN_HOSTS is not configured; refusing to connect." >&2
            exit 1
          fi
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Publish docker-compose.yml to host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          install -m 600 /dev/null deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > deploy_key
          ssh-keygen -y -f deploy_key > /dev/null
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -i deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_DIR'"
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -i deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cat > '$DEPLOY_DIR/docker-compose.yml'" < docker-compose.yml
      - name: Deliver images to host over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > deploy_key
          docker save learn-watcher-platform:latest learn-watcher-platform-migrate:latest | gzip | \
            ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -i deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
              'gunzip | docker load'

  deploy:
    name: Deploy (db -> migrate -> up, rollback on failure)
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Trust deploy host
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "DEPLOY_KNOWN_HOSTS is not configured; refusing to connect." >&2
            exit 1
          fi
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy with rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          install -m 600 /dev/null deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > deploy_key
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -i deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_DIR' && IMAGE_REF='' MIGRATE_IMAGE_REF='' APP_IMAGE='learn-watcher-platform:latest' MIGRATE_IMAGE='learn-watcher-platform-migrate:latest' bash -s" \
            < scripts/deploy.sh
