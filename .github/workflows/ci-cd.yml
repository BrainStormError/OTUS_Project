name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Blocking checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Dependency rules
        run: npm run deps:check
      - name: Verify env schema matches .env.example
        run: npm run verify:env
      - name: Unit tests
        run: npm test
      - name: Integration tests (Testcontainers)
        run: npm run test:integration
      - name: Audit production dependencies
        run: npm run audit
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://build:build@localhost:5432/build
          APP_ORIGIN: http://localhost:3000
          SESSION_SECRET: build-session-secret-000000000000000000
          REGISTRATION_TICKET_SECRET: build-ticket-secret-0000000000000000
          OAUTH_CLIENT_ID: build-client-id
          OAUTH_CLIENT_SECRET: build-client-secret

  build:
    name: Build and publish image
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ steps.meta.outputs.tags }}-migrate
          cache-from: type=gha

  deploy:
    name: Deploy (save previous -> deliver -> migrate -> up, rollback on failure)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deliver and deploy with rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE_REF: ${{ needs.build.outputs.image }}
          MIGRATE_IMAGE_REF: ${{ needs.build.outputs.image }}-migrate
        run: |
          install -m 600 /dev/null deploy_key
          printf '%s' "$DEPLOY_SSH_KEY" > deploy_key
          ssh -o StrictHostKeyChecking=no -i deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "IMAGE_REF='$IMAGE_REF' MIGRATE_IMAGE_REF='$MIGRATE_IMAGE_REF' bash -s" \
            < scripts/deploy.sh
